<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ApplyPilot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="/">ApplyPilot</a>
    <div class="nav-links">
      <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">Dashboard</a>
      <a class="nav-link {% if '/settings/profile' in request.url.path %}active{% endif %}" href="/settings/profile">Profile</a>
      <a class="nav-link {% if '/settings/searches' in request.url.path %}active{% endif %}" href="/settings/searches">Searches</a>
      <a class="nav-link {% if '/settings/env' in request.url.path %}active{% endif %}" href="/settings/env">Environment</a>
      <a class="nav-link {% if '/logs' in request.url.path %}active{% endif %}" href="/logs">Logs</a>
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
